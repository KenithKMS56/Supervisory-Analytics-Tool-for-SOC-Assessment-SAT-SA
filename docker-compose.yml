services:
  satsa-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: satsa-platform:latest
    container_name: satsa-platform
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    environment:
      # Rule-pack signing key (>= 32 chars). Passed through from the host; left unset,
      # rule-pack export/import are disabled (HTTP 503) -- there is no built-in key.
      SATSA_RULEPACK_SECRET: ${SATSA_RULEPACK_SECRET:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/splash'); urllib.request.urlopen('http://127.0.0.1:8001/splash')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
