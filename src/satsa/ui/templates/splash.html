{% extends "base.html" %}

{% block title %}Welcome to SAT-SA{% endblock %}

{% set hide_nav = true %}

{% block content %}
<!-- 0xZenith SAT-SA Splash / Landing Screen -->
<div id="satsaLanding" class="satsa-landing-screen" role="region" aria-label="Welcome to SAT-SA">
  <div class="landing-theme-switcher" id="landingThemeSwitcher">
    <div class="theme-switcher-segmented" role="radiogroup" aria-label="Theme Selection">
      <button type="button" class="theme-btn theme-btn-light active" onclick="satsaSetTheme('light')" role="radio" aria-checked="true" aria-label="Light Theme" title="Light Theme">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span>Light</span>
      </button>
      <button type="button" class="theme-btn theme-btn-dark" onclick="satsaSetTheme('dark')" role="radio" aria-checked="false" aria-label="Dark Theme" title="Dark Theme">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span>Dark</span>
      </button>
    </div>
  </div>
  <div class="satsa-landing-backdrop"></div>
  <div class="satsa-landing-container">
    
    <!-- 1. LOGO / BRAND -->
    <div class="satsa-landing-brand-area">
      <div class="satsa-landing-logo-wrap">
        <img src="/static/0xzenith-logo.png" alt="0xZenith Logo" class="satsa-landing-logo">
      </div>
      <div class="satsa-landing-brand-name">0xZenith</div>
    </div>

    <!-- 2. MAIN PRODUCT TITLE -->
    <div class="satsa-landing-title-area">
      <h1 class="satsa-landing-title">
        Supervisory Analytics Tool<br>for SOC Assessment
      </h1>
      <div class="satsa-landing-id">SAT-SA</div>
    </div>

    <!-- 3. PRIMARY ACTION: LOGIN -->
    <div class="satsa-landing-action-area">
      <a href="/login" id="btnLandingLogin" class="satsa-landing-btn" style="text-decoration: none;">
        <span>Login</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>

  </div>
</div>
{% endblock %}
