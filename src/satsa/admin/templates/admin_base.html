<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Overview{% endblock %} | NCIIPC Administration Portal</title>
  <!-- No web fonts: air-gapped. Typography falls back to locally installed/system fonts. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('nciipc_theme') || localStorage.getItem('satsa_theme');
        var theme = (saved === 'dark' || saved === 'light') ? saved : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>

  <!-- Main Content Shell -->
  <main class="admin-main-container">
    
    <!-- Page Content View -->
    {% block content %}{% endblock %}

  </main>

  <!-- iOS 26 Inspired Floating Fixed Bottom Navigation Bar (Matching SAT-SA) -->
  {% if operator and not hide_nav %}
  <nav class="floating-bottom-nav" id="floatingAdminNav" aria-label="NCIIPC Administration Navigation">
    <div class="floating-nav-pill">
      
      <!-- 0. Brand / 0xZ Logo -->
      <a href="/" class="floating-nav-brand" title="0xZenith NCIIPC Control Console">
        <img src="/static/0xzenith-logo.png" alt="0xZ" class="floating-nav-brand-logo">
      </a>
      <div class="floating-nav-divider"></div>

      <!-- 1. Overview -->
      <a href="/" class="floating-nav-item {% if active_tab == 'overview' %}active{% endif %}" title="Platform Overview">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span class="nav-text">Overview</span>
      </a>

      <!-- 2. User Management -->
      <a href="/users" class="floating-nav-item {% if active_tab == 'users' %}active{% endif %}" title="User Management & Provisioning">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span class="nav-text">Users</span>
      </a>

      <!-- 3. Organisations -->
      <a href="/organisations" class="floating-nav-item {% if active_tab == 'organisations' %}active{% endif %}" title="Critical Sector Organisations">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
          <line x1="9" y1="22" x2="9" y2="22.01"></line>
          <line x1="15" y1="22" x2="15" y2="22.01"></line>
          <line x1="9" y1="6" x2="9" y2="6.01"></line>
          <line x1="15" y1="6" x2="15" y2="6.01"></line>
          <line x1="9" y1="10" x2="9" y2="10.01"></line>
          <line x1="15" y1="10" x2="15" y2="10.01"></line>
          <line x1="9" y1="14" x2="9" y2="14.01"></line>
          <line x1="15" y1="14" x2="15" y2="14.01"></line>
        </svg>
        <span class="nav-text">Organisations</span>
      </a>

      <!-- 4. Critical Sector Entities -->
      <a href="/cses" class="floating-nav-item {% if active_tab == 'cses' %}active{% endif %}" title="Critical Sector Entities (CSEs)">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span class="nav-text">Entities</span>
      </a>

      <!-- 5. Administrative Audit -->
      <a href="/audit" class="floating-nav-item {% if active_tab == 'audit' %}active{% endif %}" title="Cryptographic Audit Trail">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span class="nav-text">Audit</span>
      </a>

      <!-- SAT-SA Launcher -->
      <a href="http://localhost:8001/portfolio" target="_blank" rel="noopener noreferrer" class="floating-nav-item" title="Open SAT-SA Supervisory Workspace (:8001)">
        <svg class="nav-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
        <span class="nav-text">SAT-SA</span>
      </a>

      <!-- Divider -->
      <div class="floating-nav-divider"></div>

      <!-- Theme Switcher -->
      <button type="button" class="floating-nav-item floating-nav-theme-btn" onclick="nciipcToggleTheme()" title="Toggle Theme" aria-label="Toggle Theme">
        <svg class="nav-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
        </svg>
        <span class="nav-text">Theme</span>
      </button>

      <!-- Operator Identity & Logout -->
      <div class="floating-nav-identity" title="Logged in as {{ operator.username }} ({{ operator.role }})">
        <span class="floating-nav-user-chip">{{ operator.username }}</span>
        <form method="post" action="/logout" style="display:inline; margin:0;">
          <button type="submit" class="floating-nav-logout-action" title="Log Out from Administration Portal">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </form>
      </div>

    </div>
  </nav>
  {% endif %}

  <script>
    function nciipcToggleTheme() {
      var current = document.documentElement.getAttribute('data-theme') || 'dark';
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try {
        localStorage.setItem('nciipc_theme', next);
        localStorage.setItem('satsa_theme', next);
      } catch (e) {}
    }
  </script>
</body>
</html>
