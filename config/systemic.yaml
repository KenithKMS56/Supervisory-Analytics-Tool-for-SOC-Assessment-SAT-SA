# SAT-SA Systemic (Cross-Entity) Correlation Detector Configuration
#
# Governs satsa.rules.systemic.SystemicCorrelationDetector, which looks ACROSS
# entities rather than within one: if >= min_entity_count entities sharing the
# same soc_provider (a specific MSSP/vendor, distinct from the coarser
# soc_model category) all trigger the SAME rule_id in the same assessment run,
# that is surfaced as a distinct "systemic gap" finding -- separate from the
# individual per-entity finding cards -- because it points at a shared-vendor
# or shared-process root cause rather than any one entity's own negligence.

systemic:
  # Minimum number of distinct entities under the same shared attribute value
  # that must trigger the same rule before it is surfaced as systemic.
  min_entity_count: 3

  # The canonical-entity field used to group entities for correlation.
  # Currently only "soc_provider" is supported.
  shared_attribute: soc_provider

  # soc_provider values that represent "no external shared vendor" and should
  # never be correlated on (an in-house SOC sharing a rule with another
  # in-house SOC is not evidence of a shared-vendor problem).
  excluded_attribute_values:
    - internal

  # Rule IDs never correlated, for rules an operator knows fire across the
  # portfolio for reasons unrelated to any shared vendor. Empty by default:
  # NS05, EG12 and EG10 used to be listed because they fired on nearly every
  # entity in the synthetic dataset, but that came from generator bugs (fixed)
  # and an EG10 severity mismatch (fixed), not from the portfolio. Excluding a
  # rule here also hides a genuine shared-vendor pattern in it.
  excluded_rule_ids: []
