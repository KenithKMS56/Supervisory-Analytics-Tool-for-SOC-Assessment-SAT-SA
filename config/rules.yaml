# SAT-SA rule configuration.
#
# Per rule: display metadata, min_sample and severity_weight (read by BaseRule), and --
# only for the rules that expose tunable thresholds -- a `params` block whose keys are read
# by that rule via self.params.get(key, default). Defaults in code equal the values below,
# so removing a key does not change behaviour. tests/test_config_drift.py fails if a key
# here is not read by its rule, or if stray top-level keys appear.
rules:
  EG01:
    name: Fast High-Severity Closure
    version: 1.0.0
    domain: Investigation
    level: entity
    min_sample: 10
    severity_weight: 85
    description: Share of human-closed High/Critical alerts closed faster than the portfolio p5 close
      time with <= 1 workflow event exceeds fast_share_threshold, with at least min_fast_count such closures.
    params:
      fast_share_threshold: 0.15
      min_fast_count: 5
  EG02:
    name: Ack without Investigation
    version: 1.0.0
    domain: Investigation
    level: entity
    min_sample: 15
    severity_weight: 80
    description: Alerts acknowledged then closed with zero investigative events and brief closure note.
  EG03:
    name: Critical Closed without Escalation
    version: 1.0.0
    domain: Escalation
    level: alert
    min_sample: 5
    severity_weight: 95
    description: Critical/High true-positives closed without an escalation record or marked false-positive
      with trivial comments.
  EG04:
    name: Template-Driven Investigations
    version: 1.0.0
    domain: Investigation
    level: entity
    min_sample: 20
    severity_weight: 75
    description: Share of human-closed alerts whose closure comment falls in a normalized-hash group repeated
      >= min_hash_group_size times exceeds max_comment_hash_share.
    params:
      max_comment_hash_share: 0.25
      min_hash_group_size: 10
  EG05:
    name: Repeat Alerts without Root Cause
    version: 1.0.0
    domain: Operational Discipline
    level: entity
    min_sample: 10
    severity_weight: 70
    description: At least min_unaddressed_pairs (asset, rule) pairs that each fired >= min_repeat_count
      times, were always closed false-positive/benign, and have no linked remediation ticket.
    params:
      min_repeat_count: 8
      min_unaddressed_pairs: 2
  EG06:
    name: Metric Gaming
    version: 1.0.0
    domain: Governance and Oversight
    level: entity
    min_sample: 20
    severity_weight: 90
    description: Composite indicator detecting deadline-hugging, bulk/identical-timestamp closures, month-end
      spikes, and severity downgrades.
  EG07:
    name: Analyst Implausibility
    version: 1.0.0
    domain: Operational Discipline
    level: entity
    min_sample: 20
    severity_weight: 75
    description: Closures per analyst-hour exceeding realistic human capacity or concentrated heavily
      outside declared shifts.
  EG08:
    name: Escalation without Follow-Through
    version: 1.0.0
    domain: Escalation
    level: entity
    min_sample: 5
    severity_weight: 85
    description: Escalated alerts or cases lacking tier-2/tier-3 acknowledgment within SLA or unlinked
      to an active case.
  EG09:
    name: Backlog and Aging
    version: 1.0.0
    domain: Incident Response
    level: entity
    min_sample: 10
    severity_weight: 70
    description: Open cases exceeding multiples of resolution SLA or exhibiting no workflow activity for
      14+ days.
  EG10:
    name: KPI Reconciliation Gap
    version: 1.0.0
    domain: Governance and Oversight
    level: entity
    min_sample: 10
    severity_weight: 95
    description: Empirical High/Critical MTTR recomputed from alert timestamps exceeds the declared MTTR
      by more than mttr_gap_ratio_threshold (relative gap).
    params:
      mttr_gap_ratio_threshold: 0.6
  EG11:
    name: Disposition Extremes
    version: 1.0.0
    domain: Threat Detection
    level: entity
    min_sample: 200
    severity_weight: 80
    description: 'Abnormal disposition distribution: false positive rate > 98% with no tuning, or 0 true
      positives over 6 months.'
  EG12:
    name: Workflow Non-Conformance
    version: 1.0.0
    domain: Security Operations
    level: entity
    min_sample: 15
    severity_weight: 80
    description: Cases with skipped or out-of-order mandatory workflow stages (triage, investigate, escalate,
      contain, close).
  NS01:
    name: Silent Critical Assets
    version: 1.0.0
    domain: Threat Detection
    level: asset
    min_sample: 1
    severity_weight: 95
    description: Monitored assets with criticality >= min_asset_criticality having at least min_silent_days
      days with zero log events (days need not be consecutive).
    params:
      min_silent_days: 3
      min_asset_criticality: 3
  NS02:
    name: Missing Alert Categories
    version: 1.0.0
    domain: Threat Detection
    level: entity
    min_sample: 30
    severity_weight: 85
    description: Alert categories reported by at least min_peer_entity_count entities in the portfolio
      are completely absent for this entity.
    params:
      min_peer_entity_count: 6
  NS03:
    name: Unexpectedly Low or Flat Activity
    version: 1.0.0
    domain: Security Operations
    level: entity
    min_sample: 30
    severity_weight: 85
    description: Night-time (20:00-08:00) share of alerts below max_night_share, given at least min_alert_volume
      alerts, indicating possible monitoring blackouts outside business hours.
    params:
      max_night_share: 0.03
      min_alert_volume: 100
  NS04:
    name: Missing Records
    version: 1.0.0
    domain: Governance and Oversight
    level: entity
    min_sample: 10
    severity_weight: 90
    description: Gaps in ID sequences, True Positive alerts lacking incident cases, alerts closed without
      closure records, or orphaned references.
  NS05:
    name: Rule Coverage Gaps
    version: 1.0.0
    domain: Threat Detection
    level: entity
    min_sample: 20
    severity_weight: 75
    description: High share of enabled SIEM detection rules that have never fired or critical MITRE techniques
      completely uncovered.
  NS06:
    name: Inventory vs Telemetry
    version: 1.0.0
    domain: Cyber Resilience
    level: entity
    min_sample: 10
    severity_weight: 85
    description: Assets in asset inventory never emitting alerts (ghost assets) or uninventoried assets
      generating alerts (shadow assets).
  NS07:
    name: Absent External Reporting
    version: 1.0.0
    domain: Incident Response
    level: entity
    min_sample: 1
    severity_weight: 95
    description: 'Critical incident cases with no corresponding external notification record (NCIIPC/CERT-In)
      in the submission. Presence only: the reporting-window timeliness check is not implemented (documented
      follow-up).'
  NS08:
    name: Submission Completeness
    version: 1.0.0
    domain: Governance and Oversight
    level: entity
    min_sample: 1
    severity_weight: 90
    description: Missing monthly batches, severe volume drop vs historical baseline, or high null rate
      in mandatory fields.
