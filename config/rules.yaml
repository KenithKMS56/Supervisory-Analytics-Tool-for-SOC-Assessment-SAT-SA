# SAT-SA rule configuration.
#
# Per rule: display metadata, min_sample and severity_weight (read by BaseRule), and a
# `params` block whose keys are read by that rule via self.params.get(key, default). Every
# rule has one except EG03 and NS07 (zero tolerance) and NS08 (fixed 6-month period). Defaults in code equal the values below,
# so removing a key does not change behaviour. tests/test_config_drift.py fails if a key
# here is not read by its rule, or if stray top-level keys appear.
rules:
  EG01:
    name: Fast High-Severity Closure
    version: 1.0.0
    domain: Investigation
    level: entity
    min_sample: 10
    severity_weight: 85
    description: Share of human-closed High/Critical alerts closed faster than the portfolio p5 close
      time with <= 1 workflow event exceeds fast_share_threshold, with at least min_fast_count such closures.
    params:
      fast_share_threshold: 0.15
      min_fast_count: 5
  EG02:
    name: Ack without Investigation
    version: 1.0.0
    domain: Investigation
    level: entity
    min_sample: 15
    severity_weight: 80
    description: Share of human-closed alerts with no 'investigate' workflow event and a closure comment
      under 25 characters exceeds max_uninvestigated_share, with at least min_uninvestigated_count such alerts.
    params:
      max_uninvestigated_share: 0.15
      min_uninvestigated_count: 5
  EG03:
    name: Critical Closed without Escalation
    version: 1.0.0
    domain: Escalation
    level: alert
    min_sample: 5
    severity_weight: 95
    description: Any Critical true-positive alert with no escalation record (zero tolerance, no threshold).
  EG04:
    name: Template-Driven Investigations
    version: 1.0.0
    domain: Investigation
    level: entity
    min_sample: 20
    severity_weight: 75
    description: Share of human-closed alerts whose closure comment falls in a normalized-hash group repeated
      >= min_hash_group_size times exceeds max_comment_hash_share.
    params:
      max_comment_hash_share: 0.25
      min_hash_group_size: 10
  EG05:
    name: Repeat Alerts without Root Cause
    version: 1.0.0
    domain: Operational Discipline
    level: entity
    min_sample: 10
    severity_weight: 70
    description: At least min_unaddressed_pairs (asset, rule) pairs that each fired >= min_repeat_count
      times, were always closed false-positive/benign, and have no linked remediation ticket. The repeat
      threshold is raised to the entity's chance level when that is higher (the count that fewer than
      max_chance_pairs pairs would reach by coincidence given its alert volume and asset x rule space),
      up to twice min_repeat_count.
    params:
      min_repeat_count: 8
      min_unaddressed_pairs: 2
      max_chance_pairs: 0.5
  EG06:
    name: Metric Gaming
    version: 1.0.0
    domain: Governance and Oversight
    level: entity
    min_sample: 20
    severity_weight: 90
    description: Bulk closures (at least min_bulk_closures_per_minute human closures by one analyst in the
      same minute) or deadline-hugging (more than max_deadline_hugging_share of human closures landing
      in the last 10% of the SLA resolve window).
    params:
      min_bulk_closures_per_minute: 8
      max_deadline_hugging_share: 0.25
  EG07:
    name: Analyst Implausibility
    version: 1.0.0
    domain: Operational Discipline
    level: entity
    min_sample: 20
    severity_weight: 75
    description: One analyst closes at least min_closures_per_analyst_hour human-closed alerts within a
      single clock hour.
    params:
      min_closures_per_analyst_hour: 30
  EG08:
    name: Escalation without Follow-Through
    version: 1.0.0
    domain: Escalation
    level: entity
    min_sample: 5
    severity_weight: 85
    description: At least min_unacknowledged_escalations escalations with no Tier-2 acknowledgement
      timestamp.
    params:
      min_unacknowledged_escalations: 3
  EG09:
    name: Backlog and Aging
    version: 1.0.0
    domain: Incident Response
    level: entity
    min_sample: 10
    severity_weight: 70
    description: At least min_stale_cases cases still open more than stale_case_days days after they
      were opened.
    params:
      stale_case_days: 14
      min_stale_cases: 3
  EG10:
    name: KPI Reconciliation Gap
    version: 1.0.0
    domain: Governance and Oversight
    level: entity
    min_sample: 10
    severity_weight: 95
    description: Empirical MTTR recomputed from alert timestamps exceeds the declared MTTR by more than
      mttr_gap_ratio_threshold (relative gap), compared over the High/Critical severities the entity
      declared, each weighted by its alert count.
    params:
      mttr_gap_ratio_threshold: 0.6
  EG11:
    name: Disposition Extremes
    version: 1.0.0
    domain: Threat Detection
    level: entity
    min_sample: 200
    severity_weight: 80
    description: 'Abnormal disposition distribution, given at least min_alert_volume alerts: zero true positives,
      or a false-positive/benign rate with a robust z-score of at least max_robust_z against the peer cohort
      (spread floored at min_spread). With fewer than 3 comparable peers, the rate is compared with max_fp_rate
      instead.'
    params:
      min_alert_volume: 200
      max_robust_z: 3.5
      min_spread: 0.01
      max_fp_rate: 0.98
  EG12:
    name: Workflow Non-Conformance
    version: 1.0.0
    domain: Security Operations
    level: entity
    min_sample: 15
    severity_weight: 80
    description: At least min_skipped_cases Critical cases with no 'contain' workflow stage. (Other stage
      orderings are not checked.)
    params:
      min_skipped_cases: 2
  NS01:
    name: Silent Critical Assets
    version: 1.0.0
    domain: Threat Detection
    level: asset
    min_sample: 1
    severity_weight: 95
    description: Monitored assets with criticality >= min_asset_criticality having at least min_silent_days
      days with zero log events (days need not be consecutive).
    params:
      min_silent_days: 3
      min_asset_criticality: 3
  NS02:
    name: Missing Alert Categories
    version: 1.0.0
    domain: Threat Detection
    level: entity
    min_sample: 30
    severity_weight: 85
    description: Alert categories reported by at least min_peer_share of the entity's peer cohort (config/peers.yaml;
      every other entity when no cohort is resolved) are completely absent for this entity.
    params:
      min_peer_share: 0.6
  NS03:
    name: Unexpectedly Low or Flat Activity
    version: 1.0.0
    domain: Security Operations
    level: entity
    min_sample: 30
    severity_weight: 85
    description: Given at least min_alert_volume alerts, a night-time (20:00-08:00) share of alerts with a robust
      z-score of at most -max_robust_z against the peer cohort (spread floored at min_spread), indicating
      possible monitoring blackouts outside business hours. With fewer than 3 comparable peers, the share is
      compared with the absolute max_night_share instead.
    params:
      max_night_share: 0.03
      min_alert_volume: 100
      max_robust_z: 3.5
      min_spread: 0.02
  NS04:
    name: Missing Records
    version: 1.0.0
    domain: Governance and Oversight
    level: entity
    min_sample: 10
    severity_weight: 90
    description: At least min_tp_without_case High/Critical True Positive alerts with no linked incident
      case. (ID sequence gaps are flagged by the ingest data-quality checks, not by this rule.)
    params:
      min_tp_without_case: 3
  NS05:
    name: Rule Coverage Gaps
    version: 1.0.0
    domain: Threat Detection
    level: entity
    min_sample: 20
    severity_weight: 75
    description: More than max_dormant_share (and at least min_dormant_rules) of enabled SIEM detection
      rules never fired an alert in the period. (MITRE technique coverage is not checked.)
    params:
      max_dormant_share: 0.4
      min_dormant_rules: 5
  NS06:
    name: Inventory vs Telemetry
    version: 1.0.0
    domain: Cyber Resilience
    level: entity
    min_sample: 10
    severity_weight: 85
    description: At least min_ghost_assets inventory assets with no log events and no alerts (ghost assets).
      (Uninventoried "shadow" assets are not checked.)
    params:
      min_ghost_assets: 2
  NS07:
    name: Absent External Reporting
    version: 1.0.0
    domain: Incident Response
    level: entity
    min_sample: 1
    severity_weight: 95
    description: 'Critical incident cases with no corresponding external notification record (NCIIPC/CERT-In)
      in the submission. Presence only: the reporting-window timeliness check is not implemented (documented
      follow-up).'
  NS08:
    name: Submission Completeness
    version: 1.0.0
    domain: Governance and Oversight
    level: entity
    min_sample: 1
    severity_weight: 90
    description: Alerts cover fewer months than the review period, i.e. the months the portfolio's submissions
      cover, up to 6 (a missing monthly batch). An entity alone in the portfolio is held to 6 months.
      (Volume drops are NS03's concern; null rates are reported by the ingest data-quality checks.)
