# SAT-SA Peer Grouping Configuration
# Governs cohort formation for robust statistical baselines.

peer_groups:
  # A fallback level (sector and size, sector, size) is used when it has at least min_peers members.
  min_peers: 3
  # Below min_support members a comparison is shown as exploratory, never as an established peer
  # judgement (satsa.peers.grouping). The all-entities fallback is always exploratory.
  min_support: 5
  # Most specific first. The first level splits by SOC model and operating schedule as well, and
  # only when that still leaves min_members peers, so a small portfolio is not over-partitioned.
  hierarchy:
    - attributes: ["sector", "size_band", "soc_model", "schedule"]
      min_members: 5
    - ["sector", "size_band"]
    - ["sector"]
    - ["size_band"]
    - ["all"]

sectors:
  - "power"
  - "banking"
  - "telecom"
  - "oil_and_gas"
  - "transport"

size_bands:
  - "small"    # < 5,000 employees / < 500 assets
  - "medium"   # 5,000 - 25,000 employees
  - "large"    # > 25,000 employees / critical national infra

soc_models:
  - "inhouse"
  - "mssp"
  - "hybrid"

fallback:
  warn_on_fallback: true
  warning_message: "Weak peer group: fallback to broader cohort due to insufficient peer count (< 3 entities)."
