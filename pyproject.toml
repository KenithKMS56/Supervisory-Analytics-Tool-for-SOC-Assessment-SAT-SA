[project]
name = "satsa"
version = "0.1.0"
description = "Supervisory Analytics Tool for SOC Assessment (NCIIPC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "reportlab>=4.2.0",
    "websockets>=12.0",
]

[project.scripts]
satsa = "satsa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satsa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["DTZ001", "DTZ007", "FURB162", "RUF012", "B008"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "coverage>=7.5",
]
